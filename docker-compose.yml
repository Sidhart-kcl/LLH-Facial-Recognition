services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medipass-backend
    ports:
      - "5050:5050"
    environment:
      - FLASK_DEBUG=False
      - SIMILARITY_THRESHOLD=0.45
      - REGISTRATION_SIMILARITY_THRESHOLD=0.20
      - POSE_YAW_SIGN=-1
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/db:/app/db
      - ./backend/uploads:/app/uploads
      - insightface-models:/root/.insightface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5050
    container_name: medipass-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  insightface-models:
